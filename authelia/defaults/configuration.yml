# Default Authelia config, seeded into /data/config/configuration.yml on
# first run only (edit the copy on disk after that, not this file -
# rebuilding the add-on will NOT overwrite an existing configuration.yml).
#
# Adjust "parcelisk.net" / "auth.parcelisk.net" below if you end up using a
# different domain or auth subdomain than what we discussed.

server:
  address: 'tcp://:9091/'

log:
  level: 'info'

identity_validation:
  reset_password:
    jwt_algorithm: 'HS256'
    jwt_lifespan: '5m'

authentication_backend:
  file:
    path: '/data/config/users_database.yml'
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: 'deny'
  rules:
    - domain: '*.parcelisk.net'
      policy: 'one_factor'

session:
  name: 'authelia_session'
  same_site: 'lax'
  expiration: '1h'
  inactivity: '5m'
  cookies:
    - domain: 'parcelisk.net'
      authelia_url: 'https://auth.parcelisk.net'
      default_redirection_url: 'https://auth.parcelisk.net'

regulation:
  max_retries: 3
  find_time: '2m'
  ban_time: '5m'

storage:
  local:
    path: '/data/db/db.sqlite3'

notifier:
  # No SMTP configured - password reset links are written to a local file
  # instead of emailed. Fine for personal use; check this file if you ever
  # use "forgot password". Switch to an `smtp:` block here if you'd rather
  # get real emails.
  filesystem:
    filename: '/data/notifications/notification.txt'
